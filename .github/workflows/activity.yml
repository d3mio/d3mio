name: Update GitHub Activity

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      # ── Inject markers using Python (handles emoji/unicode safely) ─────────
      - name: Ensure activity markers exist in README.md
        run: |
          python3 << 'EOF'
          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          marker_start = "<!--START_SECTION:activity-->"
          marker_end   = "<!--END_SECTION:activity-->"

          if marker_start not in content:
              print("Markers not found — injecting now...")
              markers = f"\n{marker_start}\n{marker_end}\n"

              # Try to place after the Recent Activity heading
              heading = "## ⚡ Recent GitHub Activity"
              if heading in content:
                  content = content.replace(heading, heading + "\n" + markers, 1)
              else:
                  # Fallback: append to end of file
                  content += "\n" + markers

              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(content)
              print("Markers injected successfully.")
          else:
              print("Markers already present — skipping.")
          EOF

      # ── Commit injected markers if README changed ──────────────────────────
      - name: Commit markers if added
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && echo "No changes to commit" || (
            git add README.md &&
            git commit -m "chore: add activity section markers [skip ci]" &&
            git push
          )

      # ── Pull latest so the activity action sees the committed markers ───────
      - name: Pull latest changes
        run: git pull --rebase

      # ── Update activity feed ───────────────────────────────────────────────
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          GH_USERNAME: d3mio
          COMMIT_MSG: "chore: update recent activity [skip ci]"
          MAX_LINES: 7
          TARGET_FILE: README.md
