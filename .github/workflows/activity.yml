name: Update GitHub Activity

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← fixes Node 20 deprecation
    steps:
      - uses: actions/checkout@v4

      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          GH_USERNAME: d3mio          # ← was missing
          COMMIT_MSG: "chore: update recent activity [skip ci]"
          MAX_LINES: 7
          TARGET_FILE: README.md      # ← correct input name (was README_FILE)
          # FILTER_EVENTS: PushEvent,CreateEvent  # optional: uncomment to filter
