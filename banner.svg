<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#070b14"/>
      <stop offset="50%"  stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0d1117"  stop-opacity="0"/>
      <stop offset="18%"  stop-color="#00d4ff"  stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#58a6ff"  stop-opacity="1"/>
      <stop offset="82%"  stop-color="#00d4ff"  stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1117"  stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>
    <linearGradient id="vlineGrad" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0d1117"  stop-opacity="0"/>
      <stop offset="30%"  stop-color="#00d4ff"  stop-opacity="0.9"/>
      <stop offset="70%"  stop-color="#00d4ff"  stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1117"  stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vlineGrad2" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0d1117"  stop-opacity="0"/>
      <stop offset="30%"  stop-color="#58a6ff"  stop-opacity="0.4"/>
      <stop offset="70%"  stop-color="#58a6ff"  stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0d1117"  stop-opacity="0"/>
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtleGlow" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="edgeMask" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox">
      <linearGradient id="maskGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="black"/>
        <stop offset="6%"   stop-color="white"/>
        <stop offset="94%"  stop-color="white"/>
        <stop offset="100%" stop-color="black"/>
      </linearGradient>
      <rect width="1" height="1" fill="url(#maskGrad)"/>
    </mask>
    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#1e2d4a" opacity="0.55"/>
    </pattern>
    <clipPath id="svgClip">
      <rect width="1200" height="300"/>
    </clipPath>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Dot matrix -->
  <rect width="1200" height="300" fill="url(#dotGrid)" mask="url(#edgeMask)" opacity="0.9"/>

  <!-- Very subtle code ghost — left background -->
  <text x="102" y="96"  font-family="Courier New, monospace" font-size="11.5" fill="#58a6ff" opacity="0.11" letter-spacing="0.5">const engineer = new Architect({</text>
  <text x="102" y="114" font-family="Courier New, monospace" font-size="11.5" fill="#58a6ff" opacity="0.11" letter-spacing="0.5">  stack: [&#39;web&#39;, &#39;mobile&#39;, &#39;embedded&#39;],</text>
  <text x="102" y="132" font-family="Courier New, monospace" font-size="11.5" fill="#58a6ff" opacity="0.11" letter-spacing="0.5">  domains: { iot: true, ml: true },</text>
  <text x="102" y="150" font-family="Courier New, monospace" font-size="11.5" fill="#58a6ff" opacity="0.11" letter-spacing="0.5">  design: &#39;pixel-perfect&#39;,</text>
  <text x="102" y="168" font-family="Courier New, monospace" font-size="11.5" fill="#58a6ff" opacity="0.11" letter-spacing="0.5">  status: &#39;BUILDING&#39;</text>
  <text x="102" y="186" font-family="Courier New, monospace" font-size="11.5" fill="#58a6ff" opacity="0.11" letter-spacing="0.5">});</text>

  <!-- Very subtle code ghost — right background -->
  <text x="860" y="96"  font-family="Courier New, monospace" font-size="11.5" fill="#00d4ff" opacity="0.09" letter-spacing="0.5">// ESP32 · ADS1115 · MQTT</text>
  <text x="860" y="114" font-family="Courier New, monospace" font-size="11.5" fill="#00d4ff" opacity="0.09" letter-spacing="0.5">// React Native · Node.js</text>
  <text x="860" y="132" font-family="Courier New, monospace" font-size="11.5" fill="#00d4ff" opacity="0.09" letter-spacing="0.5">// scikit-learn · Pandas</text>
  <text x="860" y="150" font-family="Courier New, monospace" font-size="11.5" fill="#00d4ff" opacity="0.09" letter-spacing="0.5">// Figma · Adobe Suite</text>
  <text x="860" y="168" font-family="Courier New, monospace" font-size="11.5" fill="#00d4ff" opacity="0.09" letter-spacing="0.5">// MySQL · Firebase</text>
  <text x="860" y="186" font-family="Courier New, monospace" font-size="11.5" fill="#00d4ff" opacity="0.09" letter-spacing="0.5">// Git · GitHub Actions</text>

  <!-- Left vertical accent line -->
  <rect x="68" y="0" width="2" height="300" fill="url(#vlineGrad)" filter="url(#blueGlow)"/>
  <rect x="76" y="0" width="1" height="300" fill="url(#vlineGrad2)"/>

  <!-- Left bracket — top -->
  <path d="M 68 72 L 68 52 L 96 52" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.85" stroke-linecap="square" filter="url(#blueGlow)"/>
  <!-- Left bracket — bottom -->
  <path d="M 68 228 L 68 248 L 96 248" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.85" stroke-linecap="square" filter="url(#blueGlow)"/>

  <!-- Right vertical accent line -->
  <rect x="1130" y="0" width="2" height="300" fill="url(#vlineGrad)" filter="url(#blueGlow)"/>
  <rect x="1123" y="0" width="1" height="300" fill="url(#vlineGrad2)"/>

  <!-- Right bracket — top -->
  <path d="M 1132 72 L 1132 52 L 1104 52" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.85" stroke-linecap="square" filter="url(#blueGlow)"/>
  <!-- Right bracket — bottom -->
  <path d="M 1132 228 L 1132 248 L 1104 248" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.85" stroke-linecap="square" filter="url(#blueGlow)"/>

  <!-- Corner dots -->
  <circle cx="68" cy="52"  r="3" fill="#00d4ff" opacity="0.9" filter="url(#blueGlow)"/>
  <circle cx="68" cy="248" r="3" fill="#00d4ff" opacity="0.9" filter="url(#blueGlow)"/>
  <circle cx="1132" cy="52"  r="3" fill="#00d4ff" opacity="0.9" filter="url(#blueGlow)"/>
  <circle cx="1132" cy="248" r="3" fill="#00d4ff" opacity="0.9" filter="url(#blueGlow)"/>

  <!-- MAIN NAME -->
  <text x="600" y="148"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
    font-size="70"
    font-weight="700"
    fill="url(#nameGrad)"
    text-anchor="middle"
    letter-spacing="10"
    filter="url(#subtleGlow)">DISAS GAMAGE</text>

  <!-- Accent separator line -->
  <rect x="100" y="168" width="1000" height="1.2" fill="url(#accentLine)" filter="url(#blueGlow)"/>

  <!-- Role subtitle -->
  <text x="600" y="196"
    font-family="'Courier New', 'Fira Code', 'Consolas', monospace"
    font-size="13.5"
    font-weight="400"
    fill="#8b949e"
    text-anchor="middle"
    letter-spacing="3.5">SOFTWARE ENGINEER  &#xb7;  FULL-STACK  &#xb7;  IoT  &#xb7;  MACHINE LEARNING  &#xb7;  UI/UX</text>

  <!-- Portfolio URL -->
  <text x="600" y="232"
    font-family="'Courier New', monospace"
    font-size="12"
    fill="#00d4ff"
    text-anchor="middle"
    letter-spacing="2"
    opacity="0.75">&#x25B6;  disasgamage.vercel.app</text>

  <!-- Animated scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="#00d4ff" opacity="0.06">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="0,300" dur="4s" repeatCount="indefinite"/>
  </rect>

</svg>